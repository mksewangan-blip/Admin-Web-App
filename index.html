<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sewangan Admin</title><link rel=stylesheet href=style.css></head><body><section id=login class=card style="max-width:420px;margin:70px auto"><div style="text-align:center"><img src=assets/sewangan-logo.png style="width:90px"><h2>Sewangan Admin</h2></div><label>User ID / Email</label><input id=user><label>Password</label><div style="display:flex;gap:5px"><input id=pass type=password><button onclick="pass.type=pass.type==='password'?'text':'password'">Show</button></div><label><input id=remember class=tick type=checkbox checked> Remember Me</label><button onclick=login()>Login</button><button class=green onclick="alert('Contact Super Admin to reset password.')">Forgot Password</button><p id=msg></p></section><div id=app class=hidden><header><img id=logo src=assets/sewangan-logo.png><div><h2 id=brand>Sewangan Admin</h2><small id=welcome></small></div><div style="margin-left:auto"><select id=lang><option value=en>English</option><option value=hi>हिन्दी</option></select> <button class=danger onclick=logout()>Logout</button></div></header><div class=shell><aside><input id=globalSearch placeholder="Global search..." oninput=filterNav(this.value)><div id=nav></div></aside><main><div id=view></div></main></div></div><script src=config.js></script><script src=admin.js></script></body></html>
